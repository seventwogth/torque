[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/seventwogth/torque"
authors = ["David M."]

[workspace.dependencies]
torque-bridges = { path = "crates/torque-bridges", version = "0.0.1" }
torque-control = { path = "crates/torque-control", version = "0.0.1" }
torque-core = { path = "crates/torque-core", version = "0.0.1" }
torque-ipc = { path = "crates/torque-ipc", version = "0.0.1" }
torque-router = { path = "crates/torque-router", version = "0.0.1" }

anyhow = "1.0.104"
directories = "6.0.0"
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.35.0"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = "1.53.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
strip = true
lto = "thin"
panic = "abort"
codegen-units = 1
